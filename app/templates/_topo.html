{# Topo das telas do professor. `menu_ativo` (opcional) marca o item do menu em que a página está. #}
<header class="topo">
  <div class="topo-conteudo">
    <div class="topo-esquerda">
      <div class="marca">GLÓRIA <span>FIT</span></div>
      <nav class="topo-menu" aria-label="Principal">
        <a href="{{ url_for('pagina_alunos') }}"{% if menu_ativo == "alunos" %} class="ativo" aria-current="page"{% endif %}>Alunos</a>
      </nav>
    </div>
    <div class="topo-nota">{{ dispositivo_nome or "Computador autorizado" }}</div>
  </div>
</header>
