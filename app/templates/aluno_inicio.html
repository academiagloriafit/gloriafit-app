<!doctype html>
<html lang="pt-BR" class="tema-palco">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Glória Fit</title>
  <link rel="preload" href="{{ url_for('static', filename='fontes/archivo-latin-wdth-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
  {% include "_icones.html" %}
  {% include "_app_aluno.html" %}
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <div class="marca"><img src="{{ url_for('static', filename='marca/logo-gloria-fit.png') }}" alt="" width="36" height="36"><span>Glória Fit</span></div>
    </div>
  </header>

  <main class="pagina pagina-aluno">
    <section class="painel painel-aluno" aria-labelledby="titulo-inicio">
      <h1 id="titulo-inicio">Olá, {{ primeiro_nome }}!</h1>
      <p id="aviso-treino" class="texto-apoio" role="status">Buscando o seu treino…</p>
      <button id="botao-de-novo" class="botao-link botao-largo" type="button" hidden>Tentar de novo</button>
      <button id="aviso-resposta-nova" class="botao-link botao-largo meu-aviso-resposta" type="button" hidden></button>
    </section>

    <section id="treino" class="painel painel-aluno" aria-labelledby="titulo-treino" hidden>
      <div>
        <h2 id="titulo-treino" class="meu-treino-nome"></h2>
        <p id="treino-datas" class="meu-treino-datas"></p>
      </div>
      <div id="fichas-botoes" class="meu-fichas-botoes" role="group" aria-label="Fichas do treino"></div>
      <div id="ficha-atual" class="meu-ficha-atual"></div>
      <div id="comentario-treino" class="meu-comentario-treino"></div>
    </section>

    <section id="meus-comentarios" class="painel painel-aluno" aria-labelledby="titulo-meus-comentarios" hidden>
      <h2 id="titulo-meus-comentarios" class="meu-comentarios-titulo">Seus comentários</h2>
      <button id="botao-meus-comentarios" class="botao-link botao-largo" type="button" aria-expanded="false" aria-controls="lista-meus-comentarios"></button>
      <ul id="lista-meus-comentarios" class="meu-comentarios-lista" hidden></ul>
    </section>

    <section class="painel painel-aluno painel-sair">
      <button id="botao-sair" class="botao-link botao-largo" type="button">Sair</button>
      <p id="aviso-sair" class="aviso-campo" role="status"></p>
    </section>
  </main>

  <script type="module" src="{{ url_for('static', filename='aluno_inicio.js') }}"></script>
</body>
</html>
